[package]
name = "isaword"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
scraper = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures = "0.3"
