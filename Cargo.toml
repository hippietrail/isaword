[package]
name = "isaword"
version = "0.1.0"
edition = "2021"

[dependencies]
# HTTP client for web scraping. We initially tried to use smol (lighter weight)
# instead of tokio, but reqwest's dependencies (hyper, hickory-dns) require tokio:
# - hyper 1.x needs tokio for its reactor
# - hickory-dns depends on tokio internally via hickory-resolver
# Even disabling default-features and using rustls-tls doesn't avoid tokio.
# Alternative: surf/isahc have better smol support, but require API rewrite.
# Decision: Use tokio. CLI startup overhead is negligible, ecosystem is mature.
# See issue isaword-8uv for investigation details.
reqwest = { version = "0.11", features = ["json"] }

# Async runtime - required by reqwest's transitive dependencies (hyper, etc)
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# HTML DOM parsing and traversal
scraper = "0.17"

# JSON serialization/deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# URL parsing and manipulation
url = "2"

# Utilities for futures coordination (join_all, etc)
futures = "0.3"
